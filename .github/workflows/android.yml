name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: devine-le-mot/package.json

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        working-directory: devine-le-mot
        run: npm install

      - name: Préparer le projet Android
        working-directory: devine-le-mot
        run: node scripts/setup-native.js

      - name: Donner les permissions à Gradle
        working-directory: devine-le-mot/android
        run: chmod +x gradlew

      - name: Compiler l'APK Release
        working-directory: devine-le-mot/android
        run: ./gradlew assembleRelease

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: devine-le-mot-release-apk
          path: devine-le-mot/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
