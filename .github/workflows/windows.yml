name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-2022

    steps:

      # ============================================================
      # 1. Récupérer le projet
      # ============================================================
      - name: Récupérer le projet
        uses: actions/checkout@v4


      # ============================================================
      # 2. Installer Node.js
      # ============================================================
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: devine-le-mot/package.json


      # ============================================================
      # 3. Installer les dépendances
      # ============================================================
      - name: Installer les dépendances
        working-directory: devine-le-mot
        run: npm install


      # ============================================================
      # 4. Générer le projet Windows
      # ============================================================
      - name: Préparer React Native Windows
        working-directory: devine-le-mot
        run: node scripts/setup-native.js windows


      # ============================================================
      # 5. Installer les dépendances NuGet du projet Windows
      # ============================================================
      - name: Restaurer les packages NuGet
        working-directory: devine-le-mot
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host "RESTAURATION DES PACKAGES NUGET"
          Write-Host "=============================================="

          dotnet nuget locals all --clear

          if (Test-Path "windows") {
            Get-ChildItem windows -Filter "*.sln" -Recurse |
              Select-Object FullName

            Get-ChildItem windows -Filter "packages.config" -Recurse |
              Select-Object FullName
          }

          Write-Host ""
          Write-Host "Restauration NuGet..."

          dotnet restore windows

          if ($LASTEXITCODE -ne 0) {
            Write-Error "La restauration NuGet a échoué."
            exit $LASTEXITCODE
          }

          Write-Host ""
          Write-Host "Restauration NuGet terminée."


      # ============================================================
      # 6. Afficher les versions Windows App SDK disponibles
      # ============================================================
      - name: Vérifier Windows App SDK
        shell: powershell
        run: |
          Write-Host "=============================================="
          Write-Host "WINDOWS APP SDK INSTALLÉ"
          Write-Host "=============================================="

          $root = "$env:USERPROFILE\.nuget\packages\microsoft.windowsappsdk"

          if (Test-Path $root) {
            Get-ChildItem $root -Directory |
              Select-Object Name
          }
          else {
            Write-Host "Le dossier Windows App SDK n'existe pas encore."
          }


      # ============================================================
      # 7. Compiler React Native Windows
      # ============================================================
      - name: Compiler Windows Release x64
        working-directory: devine-le-mot
        run: |
          npx react-native run-windows `
            --release `
            --arch x64 `
            --no-launch `
            --no-deploy `
            --logging


      # ============================================================
      # 8. Rechercher les fichiers générés
      # ============================================================
      - name: Rechercher les fichiers générés
        working-directory: devine-le-mot
        shell: powershell
        run: |

          Write-Host "=============================================="
          Write-Host "FICHIERS EXE"
          Write-Host "=============================================="

          Get-ChildItem `
            -Path . `
            -Filter *.exe `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object FullName


          Write-Host ""
          Write-Host "=============================================="
          Write-Host "PACKAGES WINDOWS"
          Write-Host "=============================================="

          Get-ChildItem `
            -Path . `
            -Include *.msix,*.msixbundle,*.appx,*.appxbundle `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object FullName


      # ============================================================
      # 9. Créer le dossier de distribution
      # ============================================================
      - name: Créer le dossier de distribution
        working-directory: devine-le-mot
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path dist |
            Out-Null


          Write-Host "Recherche du dossier Release x64..."


          $release = Get-ChildItem `
            -Path windows `
            -Directory `
            -Recurse |
            Where-Object {
              $_.FullName -match '\\x64\\Release$'
            } |
            Select-Object -First 1


          if ($release) {

            Write-Host ""
            Write-Host "Release trouvée :"
            Write-Host $release.FullName


            Copy-Item `
              -Path "$($release.FullName)\*" `
              -Destination dist `
              -Recurse `
              -Force

          }
          else {

            Write-Host ""
            Write-Host "Impossible de trouver x64\Release."

            Write-Host ""
            Write-Host "Dossiers Windows disponibles :"

            Get-ChildItem `
              windows `
              -Recurse `
              -Directory |
              Select-Object FullName

            exit 1
          }


          Write-Host ""
          Write-Host "Contenu de dist :"

          Get-ChildItem `
            dist `
            -Recurse |
            Select-Object FullName


      # ============================================================
      # 10. Vérifier l'EXE
      # ============================================================
      - name: Vérifier l'exécutable Windows
        working-directory: devine-le-mot
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          $exe = Get-ChildItem `
            -Path dist `
            -Filter *.exe `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1


          if (-not $exe) {
            Write-Error "Aucun fichier EXE trouvé dans dist."
            exit 1
          }


          Write-Host ""
          Write-Host "EXE trouvé :"
          Write-Host $exe.FullName


      # ============================================================
      # 11. Installer Inno Setup
      # ============================================================
      - name: Installer Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress


      # ============================================================
      # 12. Préparer Inno Setup
      # ============================================================
      - name: Préparer la configuration Inno Setup
        working-directory: devine-le-mot
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"


          $exe = Get-ChildItem `
            -Path dist `
            -Filter *.exe `
            -Recurse |
            Select-Object -First 1


          if (-not $exe) {
            Write-Error "EXE principal introuvable."
            exit 1
          }


          $distPath = (Resolve-Path dist).Path

          $relativeExe = $exe.FullName.Substring(
            $distPath.Length + 1
          )


          Write-Host "EXE principal :"
          Write-Host $relativeExe


          @"
          [Setup]
          AppName=Devine le Mot
          AppVersion=1.0.0
          AppPublisher=Devine le Mot

          DefaultDirName={autopf}\Devine le Mot
          DefaultGroupName=Devine le Mot

          OutputDir=installer-output
          OutputBaseFilename=DevineLeMot-Setup

          Compression=lzma
          SolidCompression=yes

          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64

          UninstallDisplayName=Devine le Mot

          [Files]
          Source: "dist\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs

          [Icons]
          Name: "{autoprograms}\Devine le Mot"; Filename: "{app}\$relativeExe"
          Name: "{commondesktop}\Devine le Mot"; Filename: "{app}\$relativeExe"

          [Run]
          Filename: "{app}\$relativeExe"; Description: "Lancer Devine le Mot"; Flags: nowait postinstall skipifsilent
          "@ | Set-Content installer.iss -Encoding UTF8


          Write-Host ""
          Write-Host "Configuration Inno Setup :"

          Get-Content installer.iss


      # ============================================================
      # 13. Créer l'installateur EXE
      # ============================================================
      - name: Créer l'installateur EXE
        working-directory: devine-le-mot
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"


          New-Item `
            -ItemType Directory `
            -Force `
            -Path installer-output |
            Out-Null


          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss


          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup a échoué."
            exit $LASTEXITCODE
          }


          Write-Host ""
          Write-Host "Installateur créé :"

          Get-ChildItem `
            installer-output `
            -Filter *.exe |
            Select-Object FullName, Length


      # ============================================================
      # 14. Publier l'installateur
      # ============================================================
      - name: Publier l'installateur Windows
        uses: actions/upload-artifact@v4
        with:
          name: devine-le-mot-windows-installer
          path: devine-le-mot/installer-output/DevineLeMot-Setup.exe
          if-no-files-found: error
